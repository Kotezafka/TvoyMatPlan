<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура трансляции тетради</title>
  <desc id="desc">Телефон подключается по QR-коду, публикует видео через LiveKit, а браузер преподавателя вырезает область тетради, исправляет перспективу и показывает результат на доске.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4b1119"/>
      <stop offset="1" stop-color="#7f1d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#25070b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7f1d2d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315b9b"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #fff8f5; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #f8d8d2; }
      .section { font: 700 17px Arial, sans-serif; fill: #4b1119; letter-spacing: .5px; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #321016; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #5f3c40; }
      .small { font: 400 13px Arial, sans-serif; fill: #6d4b4e; }
      .flow-label { font: 600 13px Arial, sans-serif; fill: #7f1d2d; }
      .blue-label { font: 600 13px Arial, sans-serif; fill: #315b9b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fffaf8"/>
  <rect x="0" y="0" width="1600" height="116" fill="url(#header)"/>
  <text x="64" y="56" class="title">Архитектура трансляции тетради</text>
  <text x="64" y="88" class="subtitle">Видео с телефона → LiveKit → обработка области листа → доска урока</text>

  <text x="70" y="164" class="section">1. ПОДКЛЮЧЕНИЕ</text>
  <text x="590" y="164" class="section">2. МЕДИА-ТРАНСПОРТ</text>
  <text x="1015" y="164" class="section">3. ОБРАБОТКА И ДОСКА</text>

  <!-- Phone and QR -->
  <g filter="url(#shadow)">
    <rect x="70" y="198" width="300" height="180" rx="16" fill="#fff" stroke="#e6c5c5" stroke-width="2"/>
    <rect x="70" y="198" width="300" height="10" rx="5" fill="#7f1d2d"/>
    <text x="96" y="241" class="box-title">Телефон преподавателя</text>
    <text x="96" y="272" class="box-text">QR-код урока</text>
    <text x="96" y="297" class="box-text">/lesson-camera</text>
    <text x="96" y="331" class="small">Камера снимает тетрадь</text>
    <text x="96" y="352" class="small">и публикует видеопоток</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="198" width="300" height="180" rx="16" fill="#fff" stroke="#e6c5c5" stroke-width="2"/>
    <rect x="425" y="198" width="300" height="10" rx="5" fill="#b36b42"/>
    <text x="451" y="241" class="box-title">Backend Video API</text>
    <text x="451" y="272" class="box-text">camera-link</text>
    <text x="451" y="297" class="box-text">camera-token</text>
    <text x="451" y="331" class="small">Проверяет код урока</text>
    <text x="451" y="352" class="small">и выдаёт временный токен</text>
  </g>

  <path d="M370 288 H425" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="379" y="275" class="flow-label">HTTPS: код</text>
  <path d="M425 325 H370" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="376" y="347" class="flow-label">временный токен</text>

  <!-- LiveKit -->
  <g filter="url(#shadow)">
    <rect x="590" y="460" width="420" height="200" rx="18" fill="#f5f8ff" stroke="#9bb4df" stroke-width="2"/>
    <rect x="590" y="460" width="420" height="12" rx="6" fill="#315b9b"/>
    <text x="620" y="511" class="box-title">LiveKit SFU</text>
    <text x="620" y="544" class="box-text">WebRTC-медиасервер</text>
    <text x="620" y="576" class="box-text">publish: камера телефона</text>
    <text x="620" y="604" class="box-text">subscribe: браузер урока</text>
    <text x="620" y="635" class="small">Один видеопоток без серверного</text>
    <text x="620" y="654" class="small">перекодирования</text>
  </g>

  <path d="M370 360 C470 400 515 490 590 515" fill="none" stroke="#315b9b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="425" y="420" class="blue-label">WebRTC publish</text>

  <!-- Teacher browser -->
  <g filter="url(#shadow)">
    <rect x="1080" y="198" width="420" height="180" rx="16" fill="#fff" stroke="#e6c5c5" stroke-width="2"/>
    <rect x="1080" y="198" width="420" height="10" rx="5" fill="#7f1d2d"/>
    <text x="1110" y="241" class="box-title">Браузер преподавателя</text>
    <text x="1110" y="272" class="box-text">Lesson Room /lesson/[id]</text>
    <text x="1110" y="303" class="box-text">Подписка на камеру LiveKit</text>
    <text x="1110" y="338" class="small">Настройки области сохраняются</text>
    <text x="1110" y="359" class="small">для конкретного урока</text>
  </g>

  <path d="M1010 515 C1055 490 1080 390 1185 378" fill="none" stroke="#315b9b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1015" y="435" class="blue-label">WebRTC subscribe</text>

  <!-- Processing boundary -->
  <rect x="1015" y="420" width="535" height="420" rx="22" fill="#fff4f1" stroke="#c98782" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1045" y="455" class="section">ОБРАБОТКА В БРАУЗЕРЕ ПРЕПОДАВАТЕЛЯ</text>

  <g filter="url(#shadow)">
    <rect x="1050" y="485" width="220" height="128" rx="14" fill="#fff" stroke="#d7a6a1" stroke-width="2"/>
    <text x="1072" y="521" class="box-title">NotebookPerspectiveView</text>
    <text x="1072" y="551" class="box-text">4 точки границы</text>
    <text x="1072" y="577" class="box-text">перетаскивание мышью</text>
    <text x="1072" y="601" class="small">ручная настройка, как в Chattern</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1295" y="485" width="220" height="128" rx="14" fill="#fff" stroke="#d7a6a1" stroke-width="2"/>
    <text x="1317" y="521" class="box-title">Canvas-обработка</text>
    <text x="1317" y="551" class="box-text">коррекция перспективы</text>
    <text x="1317" y="577" class="box-text">поворот 90°</text>
    <text x="1317" y="601" class="small">обновление по кадрам видео</text>
  </g>

  <path d="M1270 549 H1295" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1160" y="675" width="300" height="120" rx="14" fill="#fff" stroke="#d7a6a1" stroke-width="2"/>
    <text x="1190" y="713" class="box-title">Камера тетради на доске</text>
    <text x="1190" y="744" class="box-text">ровный прямоугольник листа</text>
    <text x="1190" y="771" class="box-text">можно увеличить и переместить</text>
  </g>
  <path d="M1405 613 C1405 642 1375 660 1340 675" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Board and student -->
  <g filter="url(#shadow)">
    <rect x="70" y="725" width="405" height="150" rx="16" fill="#fff" stroke="#e6c5c5" stroke-width="2"/>
    <rect x="70" y="725" width="405" height="10" rx="5" fill="#b36b42"/>
    <text x="100" y="768" class="box-title">Общая доска Excalidraw</text>
    <text x="100" y="800" class="box-text">рисование и материалы урока</text>
    <text x="100" y="832" class="small">синхронизация через LiveKit Data Channel</text>
    <text x="100" y="854" class="small">между браузерами участников</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="755" width="350" height="120" rx="16" fill="#f5f8ff" stroke="#9bb4df" stroke-width="2"/>
    <text x="620" y="798" class="box-title">Браузер ученика</text>
    <text x="620" y="829" class="box-text">видит доску и трансляцию</text>
    <text x="620" y="856" class="small">без доступа к камере телефона</text>
  </g>

  <path d="M1160 735 C930 700 690 720 475 790" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="730" y="706" class="flow-label">готовое изображение на доске</text>
  <path d="M475 820 H590" fill="none" stroke="#315b9b" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="482" y="807" class="blue-label">board sync</text>

  <!-- API to teacher token -->
  <path d="M725 288 H1080" fill="none" stroke="#7f1d2d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="815" y="275" class="flow-label">токен урока</text>

  <!-- Legend -->
  <rect x="70" y="920" width="1430" height="45" rx="12" fill="#f8ebe8"/>
  <circle cx="98" cy="942" r="6" fill="#7f1d2d"/>
  <text x="114" y="947" class="small">управление и обработка</text>
  <circle cx="320" cy="942" r="6" fill="#315b9b"/>
  <text x="336" y="947" class="small">медиапоток и синхронизация</text>
  <text x="720" y="947" class="small">Обработка тетради не создаёт дополнительный видеопоток и не нагружает backend перекодированием.</text>
</svg>
