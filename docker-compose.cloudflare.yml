services:
  gateway:
    image: nginx:1.27-alpine
    container_name: tutor_gateway
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PUBLIC_GATEWAY_PORT:-18080}:8080'
    volumes:
      - ./infra/nginx/cloudflare-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      livekit:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tutor_cloudflared
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN for a named tunnel}
